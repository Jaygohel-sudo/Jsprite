<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="menubar" role="menubar">
      <button class="menu-btn" role="menuitem" data-menu="file">File</button>
      <button class="menu-btn" role="menuitem">Edit</button>
      <button class="menu-btn" role="menuitem">View</button>
      <button class="menu-btn" role="menuitem">Layer</button>
    </nav>
    <!-- file options -->
    <div class="dropdown hidden" id="menu-file" role="menu">
      <button role="menuitem" id="newFile">New</button>
      <button role="menuitem">Open</button>
      <hr />
      <button role="menuitem">Save</button>
      <button role="menuitem">Save As</button>
    </div>
    <!-- the main box -->
    <div id="outsidebox">
      <div id="toolbar">
        <button id="brush">Brush</button>

        <button id="eraser">Eraser</button>

        <button id="save-file">Save File</button>

        <button id="save-as">Save As</button>

        <button id="export-file">Export File</button>

        <button id="load-file">Load File</button>

        <button id="selection">Selection</button>
      </div>
      <div id="viewport">
        <div id="sprite-window"></div>
        <div id="canvas-div">
          <canvas id="canvas"></canvas>
        </div>
      </div>
      <div id="ui-div">
        <canvas id="ui"></canvas>
      </div>
    </div>
    <!-- new file box -->
    <div id="newFileDialog" class="modal hidden">
      <div class="modal-box">
        <h3>Create New File</h3>
        <div class="form-row">
          <label for="newFileNameInput">Name</label>
          <input
            id="newFileNameInput"
            type="text"
            placeholder="Untitled Sprite"
            autofocus
          />
        </div>

        <div class="form-row">
          <label for="newFileWidthInput">Height</label>
          <input id="newFileWidthInput" type="number" placeholder="width" />
        </div>

        <div class="form-row">
          <label for="newFileHeightInput">Height</label>
          <input id="newFileHeightInput" type="number" placeholder="height" />
        </div>
        <div class="buttons">
          <button id="createNewFile">Create</button>
          <button id="cancelNewFile">Cancel</button>
        </div>
      </div>
    </div>

    <!-- save dialog box -->
    <div id="saveDialog" class="modal hidden">
      <div class="modal-box">
        <h3>Save Project</h3>

        <input
          id="projectNameInput"
          type="text"
          placeholder="Project name"
          autofocus
        />

        <div class="buttons">
          <button id="saveConfirm">Save</button>
          <button id="saveCancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- load dialog box -->

    <div id="openDialog" class="modal hidden">
      <div class="modal-box">
        <h3>Open Project</h3>

        <div id="projectList" class="project-list">
          <!-- populated dynamically -->
        </div>

        <div class="buttons">
          <button id="openCancel">Cancel</button>
        </div>
      </div>
    </div>
    <!-- playback area -->
    <div id="animation-controls" class="animation-bar">
      <!-- Play / Stop buttons -->
      <button id="play-btn" title="Play Animation">▶️</button>
      <button id="stop-btn" title="Stop Animation">⏹</button>

      <!-- Loop toggle -->
      <label>
        <input type="checkbox" id="loop-toggle" checked />
        Loop
      </label>

      <!-- FPS control -->
      <label>
        FPS:
        <input type="number" id="fps-input" min="1" max="60" value="10" />
      </label>

      <!-- Frame scrub slider -->
      <label>
        Frame:
        <input type="range" id="frame-scrubber" min="0" max="0" value="0" />
        <span id="frame-counter">0 / 0</span>
      </label>
    </div>

    <!-- frame display -->
    <div id="timeline">
      <div id="timeline-header">
        <button id="addFrameBtn">Add Frame</button>
        <button id="removeFrameBtn">Remove Frame</button>
      </div>
      <div id="timeline-body">
        <div id="layer-panel"></div>
        <div id="frame"></div>
      </div>
    </div>

    <script type="module" src="main.js" defer></script>
    <script type="module" src="ui.js" defer></script>
    <script type="module" src="menubar.js" defer></script>
  </body>
</html>
